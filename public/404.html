<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <script>
    // SPA redirect: перенаправляем все несуществующие маршруты на index.html
    // GitHub Pages отдаёт 404.html для любых неизвестных путей
    const repo = '/Multi-RP';
    let path = window.location.pathname;
    if (path.startsWith(repo)) {
      path = path.slice(repo.length);
    }
    window.location.replace(repo + '/#' + path + window.location.search);
  </script>
</head>
<body></body>
</html>
